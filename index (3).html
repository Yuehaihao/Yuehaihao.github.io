  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {

    --red: #e5484d;
  }

  html, body { min-height: 100%; }

    background-attachment: fixed;

  .scene { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(72px); opacity: 0.8; }
  .orb-a { width: 380px; height: 380px; left: -90px; top: -70px; background: #c5a8ff; animation: drift 24s ease-in-out infinite alternate; }
  .orb-b { width: 340px; height: 340px; right: -80px; top: 60px; background: #7cc7ff; animation: drift 28s ease-in-out infinite alternate-reverse; }
  .orb-c { width: 300px; height: 300px; left: 32%; bottom: -120px; background: #ffb3d9; opacity: 0.6; animation: drift 32s ease-in-out infinite alternate; }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to { transform: translate3d(46px, 34px, 0) scale(1.08); }
  }

  .shell { width: min(980px, 100%); margin: 0 auto; padding: clamp(24px, 5vw, 56px) 20px 44px; }

  .glass {
    position: relative;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.26));
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid rgba(255, 255, 255, 0.72);
    border-radius: 28px;
    box-shadow:
      0 24px 60px rgba(31, 58, 105, 0.13),
      0 6px 18px rgba(31, 58, 105, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1px 0 rgba(255, 255, 255, 0.3);
  }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgba(255, 255, 255, 0.9); }
  }

  .hero { padding: 34px 28px 30px; margin-bottom: 20px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; margin-bottom: 18px;
    background: rgba(255, 255, 255, 0.55); border: 1px solid rgba(255, 255, 255, 0.85);
    transition: background 0.2s ease;
  }
  .back:hover { background: rgba(255, 255, 255, 0.85); }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 13px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--purple-dark); background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.85);
  }
  .hero-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--purple); box-shadow: 0 0 0 4px rgba(191, 90, 242, 0.2); }
  .hero h1 { margin: 14px 0 6px; font-size: clamp(30px, 6vw, 44px); font-weight: 700; letter-spacing: -0.035em; }
  .hero p { color: var(--muted); font-size: 15px; }

  .card { padding: 24px; margin-bottom: 20px; }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .card-num {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(145deg, #d68cff, #bf5af2); color: #fff;
    font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 16px rgba(191, 90, 242, 0.3), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .card h2 { font-size: 17px; font-weight: 700; }
  .subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }
  label.field { display: block; font-size: 14px; font-weight: 600; color: #45454d; margin-bottom: 7px; }
  textarea {
    width: 100%; padding: 12px 15px; font-size: 15px; font-family: inherit;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 14px; outline: none;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 #fff, 0 6px 16px rgba(31, 58, 105, 0.07);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  textarea:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 4px rgba(191, 90, 242, 0.16), inset 0 1px 0 #fff;
  }
  textarea { min-height: 90px; resize: vertical; line-height: 1.7; }
  .hint { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .btn-row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    padding: 12px 30px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
    border: none; border-radius: 14px;
    background: linear-gradient(145deg, #d68cff, #bf5af2);
    box-shadow: 0 10px 22px rgba(191, 90, 242, 0.35), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(191, 90, 242, 0.42), inset 0 1px 0 rgba(255,255,255,.4); }
  .btn:active { transform: translateY(0) scale(0.99); }
  .btn-ghost {
    color: var(--purple-dark); background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(191, 90, 242, 0.45);
    box-shadow: 0 6px 14px rgba(31, 58, 105, 0.1);
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.85); box-shadow: 0 10px 20px rgba(31, 58, 105, 0.14); }

  .count-line {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;

    background: rgba(191, 90, 242, 0.1);
    border: 1px solid rgba(191, 90, 242, 0.3);
    border-radius: 14px;
    font-size: 15px; font-weight: 700;
  }

  .section-block {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 16px; padding: 15px 17px; margin-bottom: 12px;
    box-shadow: 0 6px 16px rgba(31, 58, 105, 0.06);

  .block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
  .block-title { font-size: 16px; font-weight: 700; }
  .block-title .zh { color: var(--muted); font-weight: 600; font-size: 13px; margin-left: 6px; }
  .block-count { font-size: 12.5px; font-weight: 600; color: var(--purple-dark); background: rgba(191, 90, 242, 0.12); padding: 3px 10px; border-radius: 999px; }
  .copy-btn {
    margin-left: auto; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;

    border: 1px solid rgba(191, 90, 242, 0.4); border-radius: 999px;

  .section-head { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; margin-bottom: 8px; }

  .target-line { margin-bottom: 6px; }

    margin-top: 4px; padding: 12px 14px; border-radius: 14px; font-size: 13.5px;

  .empty-tip { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
  .footer { text-align: center; padding: 16px; font-size: 12.5px; color: var(--muted); }

  @media (prefers-color-scheme: dark) {

    .count-line { background: rgba(214, 140, 255, 0.1); border-color: rgba(214, 140, 255, 0.28); }
    .count-label { color: var(--purple); background: rgba(255,255,255,.08); }

    .country-list { color: #c9cedb; }
    .copy-btn { color: var(--purple); background: rgba(255,255,255,.08); border-color: rgba(214,140,255,.35); }
    .block-count { color: var(--purple); background: rgba(214, 140, 255, 0.14); }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {

  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none; }
    .btn { transition: none; }
  }
</style>

  '北美':'north-america','北美洲':'north-america','north america':'north-america',
  '南美':'south-america','南美洲':'south-america','south america':'south-america',
  '中美':'central-america','中美洲':'central-america','central america':'central-america',

  '欧洲':'europe','europe':'europe',
  '北欧':'northern-europe','northern europe':'northern-europe',
  '西欧':'western-europe','western europe':'western-europe',
  '东欧':'eastern-europe','eastern europe':'eastern-europe',
  '南欧':'southern-europe','southern europe':'southern-europe',
  '中欧':'central-europe','central europe':'central-europe',
  '亚洲':'asia','asia':'asia',
  '东亚':'east-asia','east asia':'east-asia',
  '东南亚':'southeast-asia','southeast asia':'southeast-asia',

  '欧盟':'eu','european union':'eu','eu':'eu',
  '东盟':'asean','asean':'asean',
  '海湾国家':'gulf','海合会':'gulf','gulf':'gulf','gulf countries':'gulf'
};

function normalize(s){
  return String(s || '').toLowerCase().replace(/\s+/g, ' ').replace(/[。.!！？?]+$/g, '').trim();
}

let lastResults = [];

function run(){
  const input = $('targetInput').value;
  if (!input.trim()){ alert('请先输入目标国家 / 地区'); return; }

  const tokens = [...new Set(input.split(/[，,、;；\/\n]+/).map(x => x.trim()).filter(Boolean))];
  const results = [];
  const unknown = [];
  for (const tok of tokens){
    const key = normalize(tok);
    const slug = ALIASES[key] || (REGIONS[key] ? key : null);
    if (slug && REGIONS[slug]) results.push({ input:tok, region:REGIONS[slug] });
    else unknown.push(tok);
  }

  lastResults = results;
  const resultCard = $('resultCard');
  resultCard.style.display = 'block';

  if (results.length){
    $('countLine').textContent = results.map(r => r.region.en + '：' + r.region.countries.length).join('；');
  } else {
    $('countLine').textContent = '（没有匹配到任何地区）';
  }

  const totalCountries = results.reduce((n, r) => n + r.region.countries.length, 0);
  $('resultSubtitle').textContent = '共识别 ' + results.length + ' 个目标，合计 ' + totalCountries + ' 个国家';
  $('chineseTargets').innerHTML = results.map(r =>
    '<div class="target-line">' + escapeHtml(r.input) + '：' + escapeHtml(r.region.countries.map(c => CN_NAMES[c] || c).join('、')) + '</div>'
  ).join('');
  $('mergedList').innerHTML = results.map(r =>
    '<div class="target-line">' + escapeHtml(r.region.en) + '：' + escapeHtml(r.region.countries.join(', ')) + '</div>'
  ).join('');
  $('mergedCount').textContent = '共 ' + totalCountries + ' 个国家';

  if (unknown.length){
    $('unknownBox').style.display = 'block';
    $('unknownBox').textContent = '未识别，已忽略：' + unknown.join('、') + '。支持的地区请参考输入框下方提示。';
  } else {
    $('unknownBox').style.display = 'none';
  }

  $('copyAllBtn').style.display = results.length ? 'inline-block' : 'none';
  resultCard.scrollIntoView({behavior:'smooth'});
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyText(text){
  const done = () => {
    const btn = document.activeElement;
    if (btn && btn.classList.contains('copy-btn')){ const old = btn.textContent; btn.textContent = '已复制'; setTimeout(()=>{ btn.textContent = old; }, 1200); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  if (done) done();
}

function loadSample(){
  $('targetInput').value = '美洲，欧洲';
  run();
}

$('runBtn').addEventListener('click', run);
$('sampleBtn').addEventListener('click', loadSample);

$('copyAllBtn').addEventListener('click', function(){
  const merged = [];
  for (const r of lastResults){
    for (const c of r.region.countries){
      if (!merged.includes(c)) merged.push(c);
    }
  }
  copyText(merged.join(', '));
});
