    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 7000);
    var res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=zh-CN|en', { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return null;
    var data = await res.json();
    var mt = (data.responseData && data.responseData.translatedText) || '';
    if (mt && !/INVALID|NO QUERY|MYMEMORY WARNING/i.test(mt)) return mt.trim();
    return null;
  } catch (e) { return null; }
}

async function run(){
  var input = $('kwInput').value;
  if (!input.trim()){ alert('请先输入客户的主营业务关键词'); return; }

  var key = normalize(input);
  var entry = INDUSTRY_DB[key] || (ALIASES[key] ? INDUSTRY_DB[ALIASES[key]] : null);
  var resultCard = $('resultCard');
  resultCard.style.display = 'block';

  var enText = entry ? entry.en : '翻译中…';
  $('enName').textContent = enText;
  $('transNote').style.display = 'none';

  if (entry){
    $('explainText').innerHTML = escapeHtml(entry.explain);
    $('fieldChips').innerHTML = chips(entry.fields);
    $('synList').innerHTML = bulletList(entry.synonyms);
    $('relatedList').innerHTML = bulletList(entry.related);
    $('downstreamList').innerHTML = bulletList(entry.downstream);
    $('functionList').innerHTML = bulletList(entry.functions);
    $('fieldList').innerHTML = bulletList(entry.fields);
    $('unknownNote').style.display = 'none';
  } else {
    $('explainText').textContent = '该关键词暂未收录到行业知识库。';
    $('fieldChips').textContent = '暂未收录';
    $('synList').textContent = '暂未收录';
    $('relatedList').textContent = '暂未收录';
    $('downstreamList').textContent = '暂未收录';
    $('functionList').textContent = '暂未收录';
    $('fieldList').textContent = '暂未收录';
    var note = $('unknownNote');
    note.style.display = 'block';
    note.textContent = '这个关键词不在行业库中：英文名称为在线自动翻译，仅供参考；如果你想补充它的通俗解读和关联产品，把行业说明发给我，我来帮你收录。';

    var translated = await translateFallback(input);
    $('enName').textContent = translated || '未找到翻译（请检查输入或网络）';
    if (!translated){
      $('transNote').style.display = 'block';
      $('transNote').textContent = '在线翻译暂不可用，建议直接使用词典里已收录的关键词。';
    }
  }

  resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyText(text, btn){
  function done(){ if (btn){ var old = btn.textContent; btn.textContent = '已复制'; setTimeout(function(){ btn.textContent = old; }, 1500); } }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(); });
  } else { fallback(); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta); done();
  }
}

function collectResult(){
  var lines = [];
  lines.push('行业关键词速览');
  lines.push('英文名称：' + $('enName').textContent);
  lines.push('通俗解读：' + $('explainText').textContent);
  var chipTexts = Array.prototype.map.call($('fieldChips').querySelectorAll('.chip'), function(c){ return c.textContent; });
  lines.push('应用领域：' + (chipTexts.length ? chipTexts.join('、') : $('fieldChips').textContent));
  function grab(el){
    var items = Array.prototype.map.call(el.children || [], function(c){ return c.textContent; });
    return items.length ? items.join('、') : el.textContent;
  }
  var synEl = $('synList'), relEl = $('relatedList'), downEl = $('downstreamList'), funEl = $('functionList'), fldEl = $('fieldList');
  lines.push('同义词：' + grab(synEl));
  lines.push('关联产品：' + grab(relEl));
  lines.push('下游产品：' + grab(downEl));
  lines.push('产品作用：' + grab(funEl));
  lines.push('应用领域：' + grab(fldEl));
  return lines.join('\n');
}

$('runBtn').addEventListener('click', run);
$('sampleBtn').addEventListener('click', function(){ $('kwInput').value = '电子元器件'; run(); });
$('kwInput').addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run(); });
$('copyEnBtn').addEventListener('click', function(){ copyText($('enName').textContent, $('copyEnBtn')); });
$('copyAllBtn').addEventListener('click', function(){ copyText(collectResult(), $('copyAllBtn')); });
</script>
