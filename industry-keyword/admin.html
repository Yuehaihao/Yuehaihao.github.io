<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>词库管理后台 · YEuhub.ME</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230fb5a0'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%9A%99%3C/text%3E%3C/svg%3E" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --ink:#1c1c1e; --muted:#64646b; --teal:#0fb5a0; --teal-dark:#0a8c7c; --red:#e5484d; --orange:#ff9f0a; --blue:#0a84ff; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); line-height: 1.6;
    background:
      radial-gradient(1100px 720px at 12% -8%, #e0f7f2 0%, transparent 55%),
      radial-gradient(900px 640px at 100% 0%, #eaf3ff 0%, transparent 55%),
      linear-gradient(180deg, #f6f8fc 0%, #e9eef7 100%);
    background-attachment: fixed;
  }
  .shell { width: min(1060px, 100%); margin: 0 auto; padding: clamp(24px, 5vw, 56px) 20px 44px; }
  .glass {
    position: relative;
    background: linear-gradient(145deg, rgba(255,255,255,0.62), rgba(255,255,255,0.26));
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid rgba(255,255,255,0.72);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(31,58,105,0.13), 0 6px 18px rgba(31,58,105,0.07), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.3);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgba(255,255,255,0.9); }
  }
  .hero { padding: 30px 28px 26px; margin-bottom: 20px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; margin-bottom: 16px;
    background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.85);
  }
  .back:hover { background: rgba(255,255,255,0.85); }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 13px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--teal-dark); background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.85);
  }
  .hero-badge::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 4px rgba(15,181,160,0.2); }
  .hero h1 { margin: 14px 0 6px; font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: -0.035em; }
  .hero p { color: var(--muted); font-size: 15px; }

  .card { padding: 22px; margin-bottom: 20px; }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-num {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(145deg, #4fd8c5, #0fb5a0); color: #fff;
    font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 16px rgba(15,181,160,0.3), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .card h2 { font-size: 17px; font-weight: 700; }
  .subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .head-right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    padding: 10px 20px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
    border: none; border-radius: 12px;
    background: linear-gradient(145deg, #4fd8c5, #0fb5a0);
    box-shadow: 0 8px 18px rgba(15,181,160,0.32), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(0.99); }
  .btn-ghost {
    color: var(--teal-dark); background: rgba(255,255,255,0.6);
    border: 1px solid rgba(15,181,160,0.45); box-shadow: 0 6px 14px rgba(31,58,105,0.1);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.85); }
  .btn-danger {
    color: #fff; background: linear-gradient(145deg, #ff7a7f, #e5484d);
    box-shadow: 0 8px 18px rgba(229,72,77,0.3), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-sm { padding: 5px 12px; font-size: 12.5px; border-radius: 999px; }

  input[type="text"], input[type="password"], textarea, input:not([type]) {
    width: 100%; padding: 11px 14px; font-size: 14.5px; font-family: inherit;
    color: var(--ink); background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.9); border-radius: 12px; outline: none;
    box-shadow: inset 0 1px 0 #fff, 0 6px 16px rgba(31,58,105,0.07);
  }
  input:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(15,181,160,0.16), inset 0 1px 0 #fff; }
  textarea { resize: vertical; line-height: 1.7; }
  label.field { display: block; font-size: 13.5px; font-weight: 600; color: #45454d; margin-bottom: 4px; }

  .gate-locked { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 26px 0 10px; }
  .gate-locked[hidden], [hidden] { display: none !important; }
  .gate-icon {
    width: 64px; height: 64px; display: grid; place-items: center; border-radius: 20px;
    color: var(--teal); background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(255,255,255,0.55));
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: inset 0 1px 0 #fff, 0 10px 22px rgba(31,58,105,0.14);
  }
  .gate-icon svg { width: 30px; height: 30px; }
  .gate-title { font-size: 22px; font-weight: 700; }
  .gate-desc { color: var(--muted); font-size: 14px; }
  .gate-form { display: flex; gap: 10px; width: min(400px, 100%); }
  .gate-form input { flex: 1; min-width: 0; border-radius: 999px; }
  .gate-form .btn { border-radius: 999px; padding: 0 26px; }
  .gate-error { color: var(--red); font-size: 13px; font-weight: 600; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-bottom: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 680px) { .form-grid { grid-template-columns: 1fr; } }

  .search-box { max-width: 320px; margin-left: auto; }
  .kw-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 11px 14px; margin-bottom: 8px; border-radius: 14px;
    background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.9);
  }
  .kw-row .kw-name { font-weight: 700; font-size: 15px; }
  .kw-row .kw-en { color: var(--muted); font-size: 13.5px; flex: 1; min-width: 140px; word-break: break-word; }
  .badge { flex-shrink: 0; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-builtin { color: var(--muted); background: rgba(120,125,140,0.12); }
  .badge-custom { color: #8a5a00; background: rgba(255,159,10,0.14); }
  .badge-modified { color: var(--blue); background: rgba(10,132,255,0.12); }
  .badge-hidden { color: var(--red); background: rgba(229,72,77,0.1); }
  .row-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .empty-tip { text-align: center; color: var(--muted); padding: 26px 0; font-size: 14px; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; color: #fff;
    background: rgba(28,28,30,0.88); box-shadow: 0 12px 30px rgba(0,0,0,0.25); z-index: 50;
    transition: opacity 0.3s ease;
  }
  .footer { text-align: center; padding: 16px; font-size: 12.5px; color: var(--muted); }

  @media (prefers-color-scheme: dark) {
    :root { --ink:#f5f5f7; --muted:#9da0aa; --teal:#4fd8c5; --teal-dark:#4fd8c5; --red:#ff7a7f; --orange:#ffc260; --blue:#6cb9ff; }
    body {
      background:
        radial-gradient(1100px 720px at 12% -8%, #0e2b27 0%, transparent 55%),
        radial-gradient(900px 640px at 100% 0%, #12223a 0%, transparent 55%),
        linear-gradient(180deg, #13151b 0%, #0c0e12 100%);
    }
    .glass {
      background: linear-gradient(145deg, rgba(255,255,255,0.13), rgba(255,255,255,0.045));
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 26px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -1px 0 rgba(0,0,0,0.25);
    }
    .back, .hero-badge { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.14); }
    label.field { color: #c6c9d2; }
    input, textarea { color: var(--ink); background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.14); box-shadow: none; }
    input:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(79,216,197,0.18); }
    .btn-ghost { color: var(--teal); background: rgba(255,255,255,0.08); border-color: rgba(79,216,197,0.4); }
    .kw-row { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14); }
    .badge-builtin { color: #9da0aa; background: rgba(255,255,255,0.1); }
    .gate-icon { background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06)); border-color: rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16); }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: rgba(26,29,38,0.9); }
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="hero glass">
    <a class="back" href="index.html">← 返回速览工具</a>
    <div class="hero-badge">管理后台</div>
    <h1>词库管理后台</h1>
    <p>在这里新增、修改、隐藏行业关键词，保存后「行业关键词速览」立即生效（本浏览器内）</p>
  </header>

  <section class="card glass" id="gateCard">
    <div class="gate-locked" id="gateLocked">
      <span class="gate-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="3"></rect>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
        </svg>
      </span>
      <h2 class="gate-title">需要密码</h2>
      <p class="gate-desc">输入密码后进入管理后台，30 分钟内无需重复输入。</p>
      <form class="gate-form" id="gateForm" autocomplete="off">
        <input type="password" id="gateInput" placeholder="请输入密码" aria-label="密码" />
        <button class="btn" type="submit">解锁</button>
      </form>
      <p class="gate-error" id="gateError" role="alert" hidden>密码不正确，请重新输入</p>
    </div>
  </section>

  <div id="adminPanel" hidden>
    <section class="card glass">
      <div class="card-head">
        <span class="card-num">概</span>
        <div><h2>词库概览</h2><p class="subtitle" id="statsLine">加载中…</p></div>
        <div class="head-right">
          <button class="btn btn-ghost" id="exportBtn">导出 JSON</button>
          <button class="btn btn-ghost" id="importBtn">导入 JSON</button>
          <button class="btn btn-danger" id="resetBtn">恢复全部默认</button>
        </div>
      </div>
      <div id="importBox" hidden>
        <label class="field" for="importArea">粘贴要导入的 JSON 内容</label>
        <textarea id="importArea" rows="5" placeholder='例如：{"version":1,"custom":{"口罩":{"en":"Face Masks","explain":"…","fields":[],"synonyms":[],"related":[],"downstream":[],"functions":[]}}}'></textarea>
        <div class="btn-row" style="margin-top:12px; display:flex; gap:10px;">
          <button class="btn" id="importApplyBtn">应用导入</button>
          <button class="btn btn-ghost" id="importCancelBtn">取消</button>
        </div>
      </div>
    </section>

    <section class="card glass">
      <div class="card-head">
        <span class="card-num">编</span>
        <div><h2 id="editorTitle">新增关键词</h2><p class="subtitle">带 * 为必填；列表类字段用逗号、顿号或换行分隔</p></div>
        <div class="head-right">
          <button class="btn" id="saveBtn">保存</button>
          <button class="btn btn-ghost" id="cancelEditBtn">清空表单</button>
        </div>
      </div>
      <div class="form-grid">
        <div><label class="field">关键词（中文）*</label><input type="text" id="f_key" placeholder="例如：口罩" /></div>
        <div><label class="field">英文名称 *</label><input type="text" id="f_en" placeholder="例如：Face Masks" /></div>
        <div class="full"><label class="field">通俗解读（做什么）*</label><textarea id="f_explain" rows="2" placeholder="用大白话解释这个行业是做什么的"></textarea></div>
        <div><label class="field">应用领域（逗号分隔）</label><input type="text" id="f_fields" placeholder="例如：医疗，家庭，工业" /></div>
        <div><label class="field">同义词 / 近似词</label><input type="text" id="f_syn" placeholder="例如：口罩，防护口罩" /></div>
        <div><label class="field">客户关联的产品</label><input type="text" id="f_related" placeholder="例如：熔喷布，无纺布" /></div>
        <div><label class="field">客户的下游产品</label><input type="text" id="f_down" placeholder="例如：医用耗材，个人防护" /></div>
        <div><label class="field">客户产品的作用</label><input type="text" id="f_fun" placeholder="例如：过滤病菌，防尘" /></div>
      </div>
    </section>

    <section class="card glass">
      <div class="card-head">
        <span class="card-num">库</span>
        <div><h2>词库列表</h2><p class="subtitle" id="listCount">—</p></div>
        <input type="text" id="searchInput" class="search-box" placeholder="搜索关键词或英文…" />
      </div>
      <div id="kwList"></div>
    </section>
  </div>

  <footer class="footer">Powered by GitHub Pages · yeuhub.me</footer>
</div>

<script>
(function () {
  var ADMIN_KEY = 'yeuhub_admin_unlock_ts';
  var ADMIN_MS = 30 * 60 * 1000;
  var PASSWORD_HASH = '1fe00ee9a4a47a889df0f79d0fb52fb024670306ee9130e0dd6c000e3ef7ab78';
  var CUSTOM_KEY = 'yeuhub_kw_custom_v1';

  function $(id){ return document.getElementById(id); }
  function utf8(s){ try { return unescape(encodeURIComponent(s)); } catch(e){ return s; } }
  function sha256(ascii) {
    function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
    var mathPow = Math.pow;
    var maxWord = mathPow(2, 32);
    var lengthProperty = 'length';
    var i, j;
    var result = '';
    var words = [];
    var asciiBitLength = ascii[lengthProperty] * 8;
    var hash = sha256.h = sha256.h || [];
    var k = sha256.k = sha256.k || [];
    var primeCounter = k[lengthProperty];
    var isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += '\x80';
    while ((ascii[lengthProperty] % 64) - 56) ascii += '\x00';
    for (i = 0; i < ascii[lengthProperty]; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return '';
      words[i >> 2] |= j << (((3 - i) % 4) * 8);
    }
    words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
    words[words[lengthProperty]] = (asciiBitLength);
    for (j = 0; j < words[lengthProperty];) {
      var w = words.slice(j, (j += 16));
      var oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2];
        var a = hash[0], e = hash[4];
        var temp1 = hash[7]
          + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
          + ((e & hash[5]) ^ (~e & hash[6]))
          + k[i]
          + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        var b = (hash[i] >> (j * 8)) & 255;
        result += ((b < 16) ? 0 : '') + b.toString(16);
      }
    }
    return result;
  }

  /* ---------- 密码门禁 ---------- */
  var gateLocked = $('gateLocked');
  var gateForm = $('gateForm');
  var gateInput = $('gateInput');
  var gateError = $('gateError');
  var gateTimer = null;

  function gateRemaining(){
    var ts = parseInt(localStorage.getItem(ADMIN_KEY) || '0', 10);
    if (!ts) return 0;
    var left = ADMIN_MS - (Date.now() - ts);
    return left > 0 ? left : 0;
  }
  function renderGate(){
    var left = gateRemaining();
    if (left > 0){
      gateLocked.hidden = true;
      $('gateCard').hidden = true;
      $('adminPanel').hidden = false;
      clearTimeout(gateTimer);
      gateTimer = setTimeout(renderGate, left + 1000);
      initAdmin();
    } else {
      if (localStorage.getItem(ADMIN_KEY)) localStorage.removeItem(ADMIN_KEY);
      $('adminPanel').hidden = true;
      $('gateCard').hidden = false;
      gateLocked.hidden = false;
    }
  }
  gateForm.addEventListener('submit', function(e){
    e.preventDefault();
    var pw = gateInput.value || '';
    if (sha256(utf8(pw)) === PASSWORD_HASH){
      localStorage.setItem(ADMIN_KEY, String(Date.now()));
      gateError.hidden = true;
      gateInput.value = '';
      renderGate();
    } else {
      gateError.hidden = false;
      gateInput.select();
    }
  });

  /* ---------- 词库管理 ---------- */
  var builtinDB = null;
  var builtinKeys = null;
  var editingKey = null;

  function loadCustomMap(){
    try {
      var v = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '{}');
      return (v && typeof v === 'object') ? v : {};
    } catch(e){ return {}; }
  }
  function saveCustomMap(map){ localStorage.setItem(CUSTOM_KEY, JSON.stringify(map)); }

  function normalize(s){ return String(s||'').toLowerCase().replace(/\s+/g,'').trim(); }
  function splitList(s){ return String(s||'').split(/[，,、;；\n]+/).map(function(x){ return x.trim(); }).filter(Boolean); }
  function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  async function loadBuiltin(){
    try {
      var res = await fetch('index.html', { cache: 'no-store' });
      if (!res.ok) throw new Error('http ' + res.status);
      var html = await res.text();
      var s = html.indexOf('var INDUSTRY_DB');
      if (s < 0) throw new Error('db not found');
      var e = html.indexOf('\nfunction $(id)', s);
      if (e < 0) throw new Error('end not found');
      var fn = new Function(html.slice(s, e) + '; return { DB: INDUSTRY_DB, ALIASES: ALIASES };');
      var r = fn();
      builtinDB = r.DB || {};
      builtinKeys = Object.keys(builtinDB);
    } catch(err){
      builtinDB = null;
      builtinKeys = null;
    }
    renderAll();
  }

  function toast(msg){
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 400); }, 2200);
  }

  function editorVisible(v){ $('editorTitle').textContent = v ? (editingKey ? '编辑：' + editingKey : '新增关键词') : '新增关键词'; }

  function openNew(){
    editingKey = null;
    ['f_key','f_en','f_explain','f_fields','f_syn','f_related','f_down','f_fun'].forEach(function(id){ $(id).value = ''; });
    editorVisible(true);
    $('editorTitle').textContent = '新增关键词';
    $('f_key').focus();
  }
  function openEdit(k, entry){
    editingKey = k;
    $('f_key').value = k;
    $('f_en').value = entry.en || '';
    $('f_explain').value = entry.explain || '';
    $('f_fields').value = (entry.fields || []).join('、');
    $('f_syn').value = (entry.synonyms || []).join('、');
    $('f_related').value = (entry.related || []).join('、');
    $('f_down').value = (entry.downstream || []).join('、');
    $('f_fun').value = (entry.functions || []).join('、');
    $('editorTitle').textContent = '编辑：' + k;
    editorVisible(true);
  }

  function saveEntry(){
    var key = normalize($('f_key').value);
    var en = $('f_en').value.trim();
    var explain = $('f_explain').value.trim();
    if (!key){ alert('请填写关键词（中文）'); return; }
    if (!en){ alert('请填写英文名称'); return; }
    if (!explain){ alert('请填写通俗解读'); return; }
    var entry = {
      en: en,
      explain: explain,
      fields: splitList($('f_fields').value),
      synonyms: splitList($('f_syn').value),
      related: splitList($('f_related').value),
      downstream: splitList($('f_down').value),
      functions: splitList($('f_fun').value)
    };
    var custom = loadCustomMap();
    if (editingKey && editingKey !== key && custom[editingKey]) delete custom[editingKey];
    custom[key] = entry;
    saveCustomMap(custom);
    editingKey = null;
    openNew();
    renderAll();
    toast('已保存「' + key + '」，速览工具立即生效');
  }

  function removeEntry(k){
    var custom = loadCustomMap();
    if (builtinKeys && builtinKeys.indexOf(k) !== -1){
      custom[k] = null;
      toast('已隐藏内置词条「' + k + '」');
    } else {
      delete custom[k];
      toast('已删除「' + k + '」');
    }
    saveCustomMap(custom);
    renderAll();
  }
  function restoreEntry(k){
    var custom = loadCustomMap();
    delete custom[k];
    saveCustomMap(custom);
    toast('已恢复「' + k + '」');
    renderAll();
  }

  function renderAll(){
    var custom = loadCustomMap();
    var rows = [];
    var builtinCount = builtinKeys ? builtinKeys.length : 0;
    var customCount = 0;

    if (builtinKeys){
      builtinKeys.forEach(function(k){
        var cv = custom[k];
        if (cv === null) rows.push({ key:k, entry:builtinDB[k], status:'hidden' });
        else if (cv && typeof cv === 'object') { rows.push({ key:k, entry:cv, status:'modified' }); customCount++; }
        else rows.push({ key:k, entry:builtinDB[k], status:'builtin' });
      });
    }
    Object.keys(custom).forEach(function(k){
      if (builtinKeys && builtinKeys.indexOf(k) !== -1) return;
      if (custom[k] && typeof custom[k] === 'object'){ rows.push({ key:k, entry:custom[k], status:'custom' }); customCount++; }
    });

    rows.sort(function(a,b){ return a.key.localeCompare(b.key, 'zh'); });
    var q = normalize($('searchInput').value);
    if (q){
      rows = rows.filter(function(r){
        return normalize(r.key).indexOf(q) !== -1 || normalize(r.entry.en).indexOf(q) !== -1;
      });
    }

    $('statsLine').textContent = builtinDB ? ('内置关键词 ' + builtinCount + ' 条 · 自定义（新增/修改/隐藏）' + customCount + ' 条') : '内置词库加载失败，仅显示自定义词条';
    $('listCount').textContent = '共 ' + rows.length + ' 条';

    var html = '';
    rows.forEach(function(r){
      var badge, badgeCls;
      if (r.status === 'builtin'){ badge = '内置'; badgeCls = 'badge-builtin'; }
      else if (r.status === 'modified'){ badge = '已修改'; badgeCls = 'badge-modified'; }
      else if (r.status === 'custom'){ badge = '自定义'; badgeCls = 'badge-custom'; }
      else { badge = '已隐藏'; badgeCls = 'badge-hidden'; }
      var btns = '<button class="btn btn-ghost btn-sm" data-act="edit" data-k="' + escapeHtml(r.key) + '">编辑</button>';
      if (r.status === 'hidden') btns += '<button class="btn btn-ghost btn-sm" data-act="restore" data-k="' + escapeHtml(r.key) + '">恢复</button>';
      else if (r.status === 'modified') btns += '<button class="btn btn-ghost btn-sm" data-act="restore" data-k="' + escapeHtml(r.key) + '">还原内置</button>';
      btns += '<button class="btn btn-danger btn-sm" data-act="remove" data-k="' + escapeHtml(r.key) + '">' + (r.status === 'builtin' ? '隐藏' : '删除') + '</button>';
      html += '<div class="kw-row">'
        + '<span class="kw-name">' + escapeHtml(r.key) + '</span>'
        + '<span class="kw-en">' + escapeHtml(r.entry.en) + '</span>'
        + '<span class="badge ' + badgeCls + '">' + badge + '</span>'
        + '<span class="row-btns">' + btns + '</span>'
        + '</div>';
    });
    $('kwList').innerHTML = html || '<div class="empty-tip">没有匹配的词条</div>';
  }

  function exportJson(){
    var data = { version: 1, exportedAt: new Date().toISOString(), custom: loadCustomMap() };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'industry-kw-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast('已导出 JSON 备份');
  }

  function applyImport(){
    var text = $('importArea').value.trim();
    if (!text){ alert('请先粘贴 JSON 内容'); return; }
    try {
      var parsed = JSON.parse(text);
      var incoming = parsed && parsed.custom ? parsed.custom : parsed;
      if (!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) throw new Error('bad format');
      var custom = loadCustomMap();
      Object.keys(incoming).forEach(function(k){
        if (incoming[k] === null) custom[k] = null;
        else if (incoming[k] && typeof incoming[k] === 'object' && incoming[k].en && incoming[k].explain) custom[k] = incoming[k];
      });
      saveCustomMap(custom);
      $('importBox').hidden = true;
      $('importArea').value = '';
      renderAll();
      toast('导入成功');
    } catch(err){
      alert('导入失败：JSON 格式不正确');
    }
  }

  $('saveBtn').addEventListener('click', saveEntry);
  $('cancelEditBtn').addEventListener('click', openNew);
  $('searchInput').addEventListener('input', renderAll);
  $('exportBtn').addEventListener('click', exportJson);
  $('importBtn').addEventListener('click', function(){ $('importBox').hidden = !$('importBox').hidden; });
  $('importCancelBtn').addEventListener('click', function(){ $('importBox').hidden = true; });
  $('importApplyBtn').addEventListener('click', applyImport);
  var resetArmed = false;
  $('resetBtn').addEventListener('click', function(){
    if (!resetArmed) {
      resetArmed = true;
      $('resetBtn').textContent = '再点一次确认恢复';
      setTimeout(function(){ resetArmed = false; $('resetBtn').textContent = '恢复全部默认'; }, 3000);
    } else {
      resetArmed = false;
      $('resetBtn').textContent = '恢复全部默认';
      localStorage.removeItem(CUSTOM_KEY);
      renderAll();
      toast('已恢复全部默认词库');
    }
  });
  $('kwList').addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    var k = btn.getAttribute('data-k');
    var act = btn.getAttribute('data-act');
    if (act === 'edit'){
      var custom = loadCustomMap();
      var entry = (custom[k] && typeof custom[k] === 'object') ? custom[k] : (builtinDB && builtinDB[k]) || { en:'', explain:'', fields:[], synonyms:[], related:[], downstream:[], functions:[] };
      openEdit(k, entry);
    } else if (act === 'remove'){
      var label = (builtinKeys && builtinKeys.indexOf(k) !== -1) ? '隐藏' : '删除';
      if (btn.getAttribute('data-pending') !== '1') {
        btn.setAttribute('data-orig', btn.textContent);
        btn.setAttribute('data-pending', '1');
        btn.textContent = '确认' + label + '？';
        setTimeout(function(){
          btn.setAttribute('data-pending', '0');
          btn.textContent = btn.getAttribute('data-orig') || ('确认' + label + '？');
        }, 3000);
      } else {
        removeEntry(k);
      }
    } else if (act === 'restore'){
      restoreEntry(k);
    }
  });

  var adminInited = false;
  function initAdmin(){
    if (adminInited) return;
    adminInited = true;
    openNew();
    loadBuiltin();
  }

  renderGate();
})();
</script>
</body>
</html>
