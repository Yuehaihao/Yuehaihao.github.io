<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>增长漏斗图 · 海浩 AI</title>
  <meta name="description" content="在线编辑增长漏斗，记录数据、增量、顶层占比与下周待办事项。" />
  <script src="../assets/access.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root {
      --canvas: #f7f8fc;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --ink: #172033;
      --muted: #657085;
      --line: #e2e8f0;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --danger: #e5484d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: var(--canvas); font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { width: min(1600px, 100%); min-height: 100vh; margin: 0 auto; display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 24px; padding: 24px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.05); }
    .sidebar { align-self: start; position: sticky; top: 24px; padding: 22px; }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 24px; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); border-radius: 10px; font-weight: 800; }
    .brand h1 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
    .back { display: inline-flex; margin: -7px 0 21px; color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; }
    .field-label { display: block; margin-bottom: 7px; color: #3b465a; font-size: 13px; font-weight: 700; }
    .field-hint { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .control { width: 100%; height: 42px; padding: 8px 11px; color: var(--ink); border: 1px solid #cbd5e1; border-radius: 11px; background: #fff; outline: none; }
    .control:focus, .inside-input:focus, .task-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12); }
    .section-rule { margin: 22px 0; border: 0; border-top: 1px solid #eef2f7; }
    .stage-settings { display: grid; gap: 11px; max-height: calc(100vh - 280px); overflow-y: auto; padding-right: 2px; }
    .stage-setting { padding: 12px; border: 1px solid #edf1f7; border-radius: 13px; background: var(--surface-soft); }
    .stage-setting-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stage-setting-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #49566c; font-size: 13px; font-weight: 700; }
    .color-input { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; overflow: hidden; background: transparent; }
    .check-row { display: flex; align-items: center; gap: 7px; margin-top: 10px; color: #5a6578; font-size: 12px; }
    .check-row input { accent-color: var(--accent); }
    .main { min-width: 0; display: grid; gap: 16px; align-content: start; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 22px; }
    .toolbar h2 { margin: 0; font-size: 24px; letter-spacing: -0.035em; }
    .toolbar p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar-actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 8px 13px; border: 1px solid #cbd5e1; border-radius: 10px; color: #39465c; background: #fff; font-size: 13px; font-weight: 700; transition: background 0.2s ease, transform 0.2s ease; }
    .button:hover { background: #f8fafc; transform: translateY(-1px); }
    .button.primary { color: #fff; border-color: var(--accent); background: var(--accent); }
    .button.primary:hover { background: #4338ca; }
    .export-note { min-height: 20px; margin: 0 2px; color: var(--danger); font-size: 12px; }
    .funnel-canvas { padding: clamp(22px, 4vw, 48px); overflow-x: auto; }
    .funnel-inner { min-width: 760px; }
    .funnel-stage-row { display: grid; grid-template-columns: 1fr 220px; align-items: stretch; gap: 16px; margin-bottom: 16px; }
    .funnel-stage-row:last-child { margin-bottom: 0; }
    .stage-lane { display: flex; align-items: center; justify-content: center; min-height: 118px; }
    .funnel-stage { width: var(--stage-width); min-height: 118px; display: grid; place-items: center; padding: 17px 44px; position: relative; color: #fff; clip-path: polygon(0 0, 100% 0, calc(100% - 6%) 100%, 6% 100%); background: var(--stage-color); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); transition: width 0.35s ease, background 0.2s ease; }
    .stage-content { width: 100%; text-align: center; }
    .inside-label { width: min(100%, 260px); padding: 3px 7px; color: #fff; border: 1px solid transparent; border-radius: 7px; outline: none; background: transparent; text-align: center; font-size: 16px; font-weight: 800; }
    .inside-label:hover, .inside-label:focus { border-color: rgba(255,255,255,0.58); background: rgba(255,255,255,0.12); }
    .metric-row { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 10px; white-space: nowrap; }
    .inside-input { width: 76px; padding: 2px 5px; color: #fff; border: 1px solid transparent; border-radius: 6px; outline: none; background: rgba(255,255,255,0.1); text-align: center; font-size: 20px; font-weight: 800; }
    .inside-input.value { width: 88px; font-size: 24px; }
    .inside-input.delta { width: 49px; font-size: 14px; font-weight: 700; }
    .inside-input:hover, .inside-input:focus { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.18); }
    .metric-text { font-size: 15px; font-weight: 800; }
    .metric-note { margin-top: 7px; color: rgba(255,255,255,0.82); font-size: 11px; }
    .task-card { display: flex; flex-direction: column; justify-content: center; min-height: 118px; padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-soft); }
    .task-card.hidden { visibility: hidden; }
    .task-card label { margin-bottom: 7px; color: #64748b; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; }
    .task-input { min-height: 67px; width: 100%; resize: vertical; padding: 8px; color: #334155; border: 1px solid #dbe3ee; border-radius: 9px; outline: none; background: #fff; font-size: 12px; line-height: 1.5; }
    .conversion-line { height: 25px; position: relative; display: grid; grid-template-columns: 1fr 220px; gap: 16px; align-items: center; }
    .conversion-pill { justify-self: center; grid-column: 1; z-index: 2; padding: 4px 9px; border: 1px solid #dce5f4; border-radius: 999px; color: #4f46e5; background: #fff; font-size: 11px; font-weight: 800; box-shadow: 0 2px 6px rgba(15,23,42,0.08); }
    .conversion-line::before { content: ""; position: absolute; left: 17%; right: 17%; top: 50%; height: 1px; background: #dbe3ee; }
    .legend { display: flex; gap: 18px; margin-top: 18px; color: #6b7689; font-size: 12px; }
    .legend b { color: #344156; }
    .mobile-note { display: none; }
    @media (max-width: 980px) { .app-shell { grid-template-columns: 1fr; } .sidebar { position: static; } .stage-settings { max-height: 300px; } }
    @media (max-width: 640px) { .app-shell { padding: 12px; gap: 12px; } .sidebar, .toolbar, .funnel-canvas { border-radius: 16px; } .toolbar { align-items: flex-start; flex-direction: column; } .toolbar-actions { width: 100%; } .toolbar-actions .button { flex: 1; } .mobile-note { display: block; margin-top: 12px; color: var(--muted); font-size: 12px; } }
  </style>
</head>
<body>
  <main class="app-shell" id="appRoot">
    <aside class="panel sidebar">
      <div class="brand"><div class="brand-mark">H</div><h1>漏斗图设置</h1></div>
      <a class="back" href="../index.html#work">← 返回海浩主页</a>
      <label class="field-label" for="levelCount">层级数量</label>
      <input class="control" id="levelCount" type="number" min="1" max="20" value="4" />
      <p class="field-hint">数字和括号中的变化值直接在右侧漏斗内编辑。</p>
      <hr class="section-rule" />
      <div class="stage-settings" id="stageSettings"></div>
    </aside>

    <section class="main">
      <header class="panel toolbar">
        <div><h2>增长漏斗图</h2><p>每层百分比 = 当前层数据 ÷ 顶层数据</p></div>
        <div class="toolbar-actions"><button class="button" id="exportPng" type="button">导出 PNG</button><button class="button primary" id="exportPdf" type="button">导出 PDF</button></div>
      </header>
      <p class="export-note" id="exportNote" role="alert"></p>
      <section class="panel funnel-canvas">
        <div id="funnelCapture" class="funnel-inner"></div>
        <p class="mobile-note">提示：手机上可横向滑动查看完整漏斗图。</p>
      </section>
    </section>
  </main>

  <script>
    (function () {
      var STORAGE_KEY = 'yeuhub_funnel_state_v2';
      var COLORS = ['#3b82f6', '#6366f1', '#8b5cf6', '#d946ef', '#ec4899', '#f43f5e', '#f97316'];
      var initialStages = [
        { label: '网站访客', value: 10000, delta: 5, rateDelta: 5, color: COLORS[0], actionItem: '增加社交媒体广告投放并优化搜索引擎排名。', hasActionItem: true },
        { label: '注册用户', value: 4000, delta: 0, rateDelta: 0, color: COLORS[1], actionItem: '对落地页标题和行动号召按钮进行 A/B 测试。', hasActionItem: true },
        { label: '活跃用户', value: 2000, delta: 0, rateDelta: 0, color: COLORS[2], actionItem: '启动入职邮件序列以提升活跃度。', hasActionItem: true },
        { label: '付费客户', value: 500, delta: 0, rateDelta: 0, color: COLORS[3], actionItem: '为首次升级提供限时折扣优惠。', hasActionItem: true }
      ];
      var stages = loadStages();

      function $(id) { return document.getElementById(id); }
      function loadStages() {
        try {
          var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (Array.isArray(saved) && saved.length) return saved;
        } catch (error) {}
        return initialStages.map(function (stage) { return Object.assign({}, stage); });
      }
      function saveStages() { localStorage.setItem(STORAGE_KEY, JSON.stringify(stages)); }
      function formatNumber(value) { return Math.max(0, Number(value) || 0).toLocaleString('zh-CN'); }
      function formatPercent(value) {
        var rounded = Math.round(value);
        return Math.abs(value - rounded) < 0.05 ? rounded + '%' : value.toFixed(1) + '%';
      }
      function signed(value, suffix) {
        var number = Number(value) || 0;
        return (number >= 0 ? '+' : '') + number + (suffix || '');
      }
      function clampStageWidth(stage, topValue) {
        if (!topValue) return 46;
        return Math.max(42, Math.min(100, stage.value / topValue * 100));
      }
      function updateStage(index, key, value) {
        if (key === 'value') stages[index][key] = Math.max(0, Math.round(Number(value) || 0));
        else if (key === 'delta' || key === 'rateDelta') stages[index][key] = Math.round(Number(value) || 0);
        else stages[index][key] = value;
        saveStages();
        render();
      }
      function setLevelCount(value) {
        var count = Math.max(1, Math.min(20, Number(value) || stages.length));
        if (count > stages.length) {
          while (stages.length < count) {
            var previous = stages[stages.length - 1] || { value: 1000 };
            stages.push({ label: '层级 ' + (stages.length + 1), value: Math.max(1, Math.round(previous.value * 0.8)), delta: 0, rateDelta: 0, color: COLORS[stages.length % COLORS.length], actionItem: '', hasActionItem: true });
          }
        } else stages = stages.slice(0, count);
        saveStages();
        render();
      }
      function stageSettingsHtml(stage, index) {
        return '<div class="stage-setting"><div class="stage-setting-top"><span class="stage-setting-name">' + (index + 1) + '. ' + escapeHtml(stage.label) + '</span><input class="color-input" type="color" value="' + stage.color + '" data-setting="color" data-index="' + index + '" title="更改层级颜色" /></div><label class="check-row"><input type="checkbox" data-setting="hasActionItem" data-index="' + index + '"' + (stage.hasActionItem ? ' checked' : '') + ' />显示下周待办事项</label></div>';
      }
      function stageHtml(stage, index, topValue) {
        var percent = topValue ? stage.value / topValue * 100 : 0;
        return '<div class="funnel-stage-row">' +
          '<div class="stage-lane"><div class="funnel-stage" style="--stage-width:' + clampStageWidth(stage, topValue).toFixed(2) + '%;--stage-color:' + stage.color + '"><div class="stage-content">' +
            '<input class="inside-label" aria-label="第 ' + (index + 1) + ' 层名称" value="' + escapeAttr(stage.label) + '" data-field="label" data-index="' + index + '" />' +
            '<div class="metric-row"><input class="inside-input value" type="number" min="0" value="' + stage.value + '" aria-label="第 ' + (index + 1) + ' 层数据" data-field="value" data-index="' + index + '" /><span class="metric-text">（</span><input class="inside-input delta" type="number" value="' + stage.delta + '" aria-label="第 ' + (index + 1) + ' 层数据增量" data-field="delta" data-index="' + index + '" /><span class="metric-text">）</span><span class="metric-text">' + formatPercent(percent) + '</span><span class="metric-text">（</span><input class="inside-input delta" type="number" value="' + stage.rateDelta + '" aria-label="第 ' + (index + 1) + ' 层百分比增量" data-field="rateDelta" data-index="' + index + '" /><span class="metric-text">pp）</span></div>' +
            '<div class="metric-note">数值变化 ' + signed(stage.delta) + ' · 顶层占比变化 ' + signed(stage.rateDelta, 'pp') + '</div>' +
          '</div></div></div>' +
          '<div class="task-card' + (stage.hasActionItem ? '' : ' hidden') + '"><label>下周待办事项</label><textarea class="task-input" data-field="actionItem" data-index="' + index + '" placeholder="需要做些什么来提升这个指标？">' + escapeHtml(stage.actionItem || '') + '</textarea></div>' +
        '</div>';
      }
      function conversionHtml(index) {
        var current = stages[index];
        var next = stages[index + 1];
        if (!next) return '';
        var rate = current.value ? next.value / current.value * 100 : 0;
        return '<div class="conversion-line"><span class="conversion-pill">转化率 ' + formatPercent(rate) + '</span></div>';
      }
      function render() {
        $('levelCount').value = stages.length;
        $('stageSettings').innerHTML = stages.map(stageSettingsHtml).join('');
        var topValue = Math.max(stages[0] ? stages[0].value : 0, 1);
        $('funnelCapture').innerHTML = stages.map(function (stage, index) { return stageHtml(stage, index, topValue) + conversionHtml(index); }).join('') + '<div class="legend"><span><b>数值：</b>漏斗内直接编辑</span><span><b>百分比：</b>当前层 ÷ 顶层</span><span><b>（+/-pp）：</b>手动填写目标变化</span></div>';
      }
      function escapeHtml(value) { return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
      function escapeAttr(value) { return escapeHtml(value).replace(/"/g, '&quot;'); }
      function exportChart(type) {
        var capture = $('funnelCapture');
        $('exportNote').textContent = '';
        if (!window.html2canvas) { $('exportNote').textContent = '导出组件加载失败，请检查网络后重试。'; return; }
        html2canvas(capture, { scale: 2, backgroundColor: '#ffffff' }).then(function (canvas) {
          var image = canvas.toDataURL('image/png');
          if (type === 'png') {
            var link = document.createElement('a');
            link.href = image;
            link.download = '增长漏斗图.png';
            link.click();
            return;
          }
          if (!(window.jspdf && window.jspdf.jsPDF)) { $('exportNote').textContent = 'PDF 导出组件加载失败，请检查网络后重试。'; return; }
          var PDF = window.jspdf.jsPDF;
          var pdf = new PDF({ orientation: canvas.width >= canvas.height ? 'landscape' : 'portrait', unit: 'px', format: [canvas.width, canvas.height] });
          pdf.addImage(image, 'PNG', 0, 0, canvas.width, canvas.height);
          pdf.save('增长漏斗图.pdf');
        }).catch(function () { $('exportNote').textContent = '导出失败，请稍后重试；当前编辑内容已自动保留。'; });
      }
      function bindEvents() {
        $('levelCount').addEventListener('change', function (event) { setLevelCount(event.target.value); });
        $('stageSettings').addEventListener('input', function (event) {
          var target = event.target;
          if (!target.dataset.setting) return;
          var index = Number(target.dataset.index);
          if (target.dataset.setting === 'hasActionItem') return;
          updateStage(index, target.dataset.setting, target.value);
        });
        $('stageSettings').addEventListener('change', function (event) {
          var target = event.target;
          if (target.dataset.setting !== 'hasActionItem') return;
          stages[Number(target.dataset.index)].hasActionItem = target.checked;
          saveStages();
          render();
        });
        $('funnelCapture').addEventListener('change', function (event) {
          var target = event.target;
          if (!target.dataset.field) return;
          updateStage(Number(target.dataset.index), target.dataset.field, target.value);
        });
        $('exportPng').addEventListener('click', function () { exportChart('png'); });
        $('exportPdf').addEventListener('click', function () { exportChart('pdf'); });
      }
      function guardAccess() {
        if (!window.YeuhubAccess) return;
        if (window.YeuhubAccess.remainingMs() <= 0) {
          document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#334155;background:#f8fafc">访问已过期，正在返回主页…</div>';
          window.location.replace('../index.html#work');
        }
      }
      bindEvents();
      guardAccess();
      window.addEventListener('storage', guardAccess);
      window.addEventListener('pageshow', guardAccess);
      render();
    })();
  </script>
</body>
</html>
