      <p class="workspace-intro">这里集中放置工作工具和阶段性分析。需要时快速进入，完成后随时回来复盘。</p>
    </section>
    <section class="page-width workspace-section" aria-labelledby="tools-title">
      <div class="workspace-section-head"><h2 id="tools-title">工作板块</h2><p>工具负责推进工作，分析汇总负责留住过程与结论。</p></div>

        <a class="tool-card" href="../agent/" aria-label="打开增长漏斗图">
          <div class="tool-topline"><span class="tool-tag">WORK TOOL</span><span class="tool-arrow" aria-hidden="true">↗</span></div>
          <div class="tool-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M7 10h34L30 25v10l-12 5V25L7 10Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></div>

          <p>编辑漏斗层级、数据变化和下周待办，并按网页展示效果导出。</p>
          <div class="tool-meta"><span>在线编辑</span><span>图片导出</span></div>
        </a>
        <a class="tool-card analysis-card" href="analysis/" aria-label="打开分析汇总">

          <div class="tool-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M12 8h18l7 7v25H12V8Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M30 8v8h7M18 25h13M18 31h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>

          <p>按时间收纳每一次本地 HTML 分析内容，形成可持续回看的报告档案。</p>
          <div class="tool-meta"><span>HTML 报告</span><span>持续更新</span></div>
        </a>
      </div>
    </section>
